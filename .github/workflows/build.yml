name: build

# Every push and PR builds the single-file apps (same as native/publish.sh) and uploads them as workflow artifacts.
# Pushing a tag like v1.2.0 also creates a GitHub release with both builds attached.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Publish
        working-directory: native
        run: >
          dotnet publish Ps1tl.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o out/${{ matrix.rid }}

      - name: Package
        working-directory: native/out/${{ matrix.rid }}
        run: |
          rm -f *.pdb
          name=ps1tl-${{ steps.ver.outputs.version }}-${{ matrix.rid }}
          if [ "${{ matrix.rid }}" = win-x64 ]; then
            zip -9 "../$name.zip" *
          else
            chmod +x ps1tl
            tar -czf "../$name.tar.gz" *
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ps1tl-${{ matrix.rid }}
          path: |
            native/out/*.zip
            native/out/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
